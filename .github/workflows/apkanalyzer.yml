# APKAnalyzer scan – reusable GitHub Actions workflow.
#
# Hook this into a release pipeline by uploading a built APK as an artifact
# from an upstream job and referencing it via `inputs.apk`. The job produces
# both a SARIF file (uploaded to GitHub Code Scanning) and a baseline file
# committed back to the repo for `--fail-on-new` style gating.
#
# Trigger options:
#   * workflow_dispatch — manual run from the Actions tab.
#   * pull_request      — auto-runs when an APK or rule file changes.
#
# Required repo permissions: `security-events: write` for SARIF upload.

name: APKAnalyzer Scan

on:
  workflow_dispatch:
    inputs:
      apk:
        description: "Path to the APK / AAB file (relative to repo root)"
        required: true
        type: string
      masvs:
        description: "MASVS profile (L1, L2, R)"
        required: false
        default: "L1"
        type: choice
        options: [L1, L2, R]
      fail_on:
        description: "Fail the job if a finding at this severity (or higher) is present"
        required: false
        default: "HIGH"
        type: choice
        options: [INFO, LOW, MEDIUM, HIGH, CRITICAL, NEVER]
  pull_request:
    paths:
      - "**/*.apk"
      - "**/*.aab"
      - "**/*.xapk"
      - "rules/**"
      - "apkanalyzer/**"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install APKAnalyzer
        run: |
          python -m pip install --upgrade pip
          # Editable install picks up the checked-out rules/ directory.
          pip install -e .

      - name: Install JADX (optional decompiler bridge)
        run: |
          # Optional. The pipeline auto-skips if jadx is absent.
          sudo apt-get update -qq
          sudo apt-get install -y -qq jadx || true
          jadx --version || echo "jadx not available; will skip Java rules"

      - name: Resolve APK path
        id: resolve
        run: |
          if [ -n "${{ inputs.apk }}" ]; then
            echo "apk=${{ inputs.apk }}" >> "$GITHUB_OUTPUT"
          else
            # PR trigger: pick the first changed APK / AAB / XAPK in the diff.
            changed=$(git diff --name-only --diff-filter=ACMR \
              ${{ github.event.pull_request.base.sha }} \
              ${{ github.event.pull_request.head.sha }} \
              | grep -E '\.(apk|aab|xapk)$' | head -n1)
            if [ -z "$changed" ]; then
              echo "no APK in diff — nothing to scan" >&2
              exit 0
            fi
            echo "apk=$changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Run APKAnalyzer scan
        if: steps.resolve.outputs.apk != ''
        run: |
          mkdir -p reports
          python -m main scan "${{ steps.resolve.outputs.apk }}" \
            --output reports \
            --confidence LOW \
            --masvs "${{ inputs.masvs || 'L1' }}" \
            --fail-on "${{ inputs.fail_on || 'HIGH' }}" \
            --baseline .apkanalyzer-baseline.json \
            --fail-on-new

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && steps.resolve.outputs.apk != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/report.sarif
          category: apkanalyzer

      - name: Upload report artifacts
        if: always() && steps.resolve.outputs.apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: apkanalyzer-report
          path: |
            reports/report.json
            reports/report.html
            reports/report.sarif
            reports/sbom.cdx.json
          retention-days: 30
